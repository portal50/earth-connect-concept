<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="25" fill="#101a2b"/><text x="64" y="64" font-family="Arial" font-size="38" font-weight="bold" fill="#fff">Earth Connect — a concept, not a working SDK</text><text x="64" y="108" font-family="Arial" font-size="22" fill="#b7cad8">Let visitors bring their digital objects into your 3D world.</text><g font-family="Arial"><rect x="50" y="147" width="340" height="350" rx="18" fill="#20374b"/><rect x="430" y="147" width="340" height="350" rx="18" fill="#20374b"/><rect x="810" y="147" width="340" height="350" rx="18" fill="#20374b"/><text x="77" y="187" font-size="23" fill="#fff">1 · Your 3D world</text><text x="457" y="187" font-size="23" fill="#fff">2 · A visitor arrives</text><text x="837" y="187" font-size="23" fill="#fff">3 · Host controls access</text><g stroke="#a3bdce" stroke-width="7" fill="none"><path d="M107 415V286h225v129M107 286l112-62 113 62M144 415v-88h150v88"/><path d="M487 415V286h225v129M487 286l112-62 113 62M524 415v-88h150v88"/><path d="M867 415V286h225v129M867 286l112-62 113 62M904 415v-88h150v88"/></g><g fill="#e6a564"><circle cx="588" cy="368" r="27"/><path d="M563 352l-8-28 25 13M608 352l8-28-25 13"/><circle cx="978" cy="368" r="27"/><path d="M953 352l-8-28 25 13M998 352l8-28-25 13"/></g><g fill="#fff" font-size="18"><text x="78" y="456">Built with your own engine</text><text x="458" y="456">Mimi comes from elsewhere</text><text x="838" y="456">Accept, reject or limit</text></g></g><path d="M392 323h34m-11-12 11 12-11 12M772 323h34m-11-12 11 12-11 12" stroke="#78e0be" stroke-width="5" fill="none"/><text x="64" y="560" font-family="Arial" font-size="25" fill="#83e5c2">Question for Three.js creators: would you integrate this into a world you already own?</text><text x="64" y="607" font-family="Arial" font-size="19" fill="#b7cad8">Illustrative storyboard only. Universal compatibility and cross-runtime object visits are NOT implemented.</text></svg>